# go to sleep after one hour (1*60*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y

CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Uncomment the following line to enable NKRO
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse enable
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

#soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# Screen Driver Configurations
CONFIG_ZMK_DISPLAY=y

# Custom Cyclops Image Source Definition Array 
# Mapped directly to overwrite default background buffer parameters
CONFIG_NICE_OLED_CUSTOM_ART=y
CONFIG_NICE_OLED_ART_DATA=0x00,0x00,0x00,0x00,0x00,0x01,0x07,0x3F,0xFF,0xFF,0xFC,0x1E,0x07,0x01,0x00,0x00,0x00,0x00,0x00,0x01,0x07,0x1E,0xFC,0xFF,0xFF,0x3F,0x07,0x01,0x00,0x00,0x00,0x00,0x00,0x60,0xF8,0xFE,0xFF,0x1F,0x03,0x00,0x01,0x07,0x1F,0x7F,0xFF,0xFC,0xF0,0x00,0x00,0x0C,0x1F,0x7F,0xFF,0xFC,0xC0,0x00,0x00,0x03,0x1F,0xFF,0xFF,0x7F,0x1F,0x02,0x00,0x00,0x01,0x0F,0x7F,0xFF,0xFF,0xF0,0xC0,0x00,0x00,0x03,0x3F,0xFF,0xFF,0x3F,0x01,0x00,0x00,0x01,0x1F,0xFF,0xFF,0xF8,0x80,0x00,0x00,0x03,0x3F,0xFF,0xFF,0x1F,0x00,0x00,0x00,0x00,0x0E,0x3F,0x7F,0xFF,0xFF,0xFF,0xFC,0xF0,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x0F,0x3F,0xFF,0xFF,0xFF,0xFF,0xFE,0xFC,0xE0,0x00,0x00,0x00
